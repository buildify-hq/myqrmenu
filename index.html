    <!-- Complete Self-Contained App -->
    <script type="module">
import { createRoot } from "react-dom/client";
import React, { useState, useEffect, useMemo } from "react";
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyDL_AyEqLAZ7mafIN3J5AMV2n3uShEeW8",
  authDomain: "menu-qr-b8765.firebaseapp.com",
  projectId: "menu-qr-b8765",
  storageBucket: "menu-qr-b8765.firebasestorage.app",
  messagingSenderId: "71280897038",
  appId: "1:71280897038:web:180294fd94d32e6f11205f",
  measurementId: "G-TNKM262EVG"
};

var app = null, db = null, isFirebaseAvailable = false;
try {
  app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
  db = getFirestore(app);
  isFirebaseAvailable = true;
} catch (err) {
  isFirebaseAvailable = false;
}

const DEFAULT_RESTAURANTS = [
  {
    id: "rest-101", name: "Sagar's Cafe", tagline: "Fresh Brews, Delicious Bites & More",
    ownerPin: "111111", kitchenPin: "222222", subscriptionStatus: "ACTIVE",
    dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
  }
];

function getDaysRemaining(dueDateStr) {
  if (!dueDateStr) return 0;
  return Math.ceil((new Date(dueDateStr).getTime() - new Date().getTime()) / (1000 * 60 * 60 * 24));
}

export default function App() {
  const queryParams = new URLSearchParams(window.location.search);
  const urlRestId = queryParams.get("restId") || queryParams.get("restaurantId") || "rest-101";
  const urlTable = parseInt(queryParams.get("table") || "5", 10);
  const isStaffInitial = window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") || queryParams.get("staff") === "true";
  
  const [currentRestId, setCurrentRestId] = useState(urlRestId);
  const [currentTable, setCurrentTable] = useState(urlTable);
  const [restaurants, setRestaurants] = useState(DEFAULT_RESTAURANTS);
  const [currentView, setCurrentView] = useState(isStaffInitial ? "login" : "customer");

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    const unsub = onSnapshot(collection(db, "restaurants"), (snapshot) => {
      if (!snapshot.empty) {
        const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        setRestaurants(prev => {
          const map = new Map();
          DEFAULT_RESTAURANTS.forEach(r => map.set(r.id, r));
          prev.forEach(r => map.set(r.id, r));
          list.forEach(r => map.set(r.id, { ...map.get(r.id), ...r }));
          return Array.from(map.values());
        });
      }
    });
    return () => unsub();
  }, []);

  const handleReturnToCustomer = () => {
    if (window.location.pathname.includes('/staff') || window.location.search.includes('staff=true')) {
      window.history.pushState({}, '', `/?restId=${currentRestId}&table=${currentTable}`);
    }
    setCurrentView("customer");
  };

  const currentRestaurant = useMemo(() => {
    return restaurants.find(r => r.id === currentRestId) || DEFAULT_RESTAURANTS[0];
  }, [restaurants, currentRestId]);

  return React.createElement(
    "div",
    { className: "min-h-screen bg-stone-50 text-stone-900 font-sans" },
    currentView === "customer" && React.createElement(CustomerView, { restaurant: currentRestaurant, tableNumber: currentTable }),
    currentView === "login" && React.createElement(PinLoginModal, {
        restaurants, defaultRestId: currentRestId,
        onSuccess: (session) => {
          if (session.role === "admin") setCurrentView("admin");
          else if (session.role === "owner") { setCurrentRestId(session.restaurantId); setCurrentView("owner"); }
          else if (session.role === "kitchen") { setCurrentRestId(session.restaurantId); setCurrentView("kitchen"); }
        },
        onCancel: handleReturnToCustomer,
      }),
    currentView === "owner" && React.createElement(OwnerDashboard, { restaurant: currentRestaurant, onLogout: handleReturnToCustomer }),
    currentView === "kitchen" && React.createElement(KitchenDashboard, { restaurant: currentRestaurant, onLogout: handleReturnToCustomer }),
    currentView === "admin" && React.createElement(SuperAdminDashboard, { restaurants, onLogout: handleReturnToCustomer, setRestaurants })
  );
}

// --- CUSTOMER VIEW ---
function CustomerView({ restaurant, tableNumber }) {
  const restaurantId = restaurant?.id || "rest-101";
  const [menuItems, setMenuItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [cart, setCart] = useState([]);
  const [selectedCategory, setSelectedCategory] = useState("All");
  const [searchQuery, setSearchQuery] = useState("");
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isOrderSubmitting, setIsOrderSubmitting] = useState(false);
  const [showSuccessModal, setShowSuccessModal] = useState(false);
  const [specialInstructions, setSpecialInstructions] = useState("");
  const [waiterCalled, setWaiterCalled] = useState(false);
  const [lang, setLang] = useState("en");

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    const unsub = onSnapshot(collection(db, "restaurants", restaurantId, "menuItems"), (snap) => {
      setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return () => unsub();
  }, [restaurantId]);

  const categories = ["All", "Veg", "Non-Veg", "Mains", "Snacks", "Drinks", "Ice Cream", "Desserts"];
  const filteredItems = useMemo(() => {
    return menuItems.filter(item => {
      if (item.available === false) return false;
      const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
      let matchCategory = selectedCategory === "All" || 
        (selectedCategory === "Veg" && item.isVegetarian) || 
        (selectedCategory === "Non-Veg" && !item.isVegetarian) ||
        item.category === selectedCategory;
      return matchSearch && matchCategory;
    });
  }, [menuItems, selectedCategory, searchQuery]);

  const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);
  const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const taxAmount = cartSubtotal * 0.05;
  const grandTotal = cartSubtotal + taxAmount;

  const addToCart = (item) => setCart(prev => {
    const ex = prev.find(i => i.id === item.id);
    if (ex) return prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i);
    return [...prev, { ...item, qty: 1 }];
  });
  const updateCartQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? { ...i, qty: i.qty + delta } : i).filter(i => i.qty > 0));

  const handleCallWaiter = async () => {
    setWaiterCalled(true);
    setTimeout(() => setWaiterCalled(false), 8000);
    if (isFirebaseAvailable && db) {
      await addDoc(collection(db, "restaurants", restaurantId, "waiterCalls"), {
        tableNumber: tableNumber || 1, createdAt: new Date().toISOString(), timestamp: Date.now(), resolved: false,
      });
    }
  };

  const handlePlaceOrder = async () => {
    if (cart.length === 0 || isOrderSubmitting) return;
    setIsOrderSubmitting(true);
    const payload = {
      tokenNumber: "TB-" + Math.floor(100 + Math.random() * 900),
      tableNumber: tableNumber || 1,
      items: cart, totalAmount: grandTotal, specialInstructions: specialInstructions.trim(),
      status: "PENDING", createdAt: new Date().toISOString(), timestamp: Date.now(),
    };
    if (isFirebaseAvailable && db) {
      await addDoc(collection(db, "restaurants", restaurantId, "orders"), payload);
    }
    setIsOrderSubmitting(false); setIsCartOpen(false); setShowSuccessModal(true); setCart([]); setSpecialInstructions("");
  };

  return React.createElement(
    "div", { className: "min-h-screen bg-stone-50 pb-28" },
    // Header
    React.createElement("header", { className: "bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs" },
      React.createElement("div", { className: "max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center" },
        React.createElement("div", { className: "flex items-center gap-3" },
          React.createElement("div", { className: "w-10 h-10 rounded-2xl bg-amber-600 text-white flex items-center justify-center font-black text-lg shadow-sm" }, restaurant.name?.charAt(0) || "S"),
          React.createElement("div", null,
            React.createElement("h1", { className: "font-black text-base text-stone-900 leading-tight" }, restaurant.name),
            React.createElement("div", { className: "flex items-center gap-2 text-xs text-stone-500 mt-0.5" },
              React.createElement("span", { className: "font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200/60" }, `Table ${tableNumber}`),
              React.createElement("span", { className: "truncate max-w-[120px]" }, restaurant.tagline)
            )
          )
        ),
        React.createElement("div", { className: "flex items-center gap-1 bg-stone-100 rounded-xl p-1" },
          ["en", "hi", "mr"].map(l => React.createElement("button", {
            key: l, onClick: () => setLang(l),
            className: `px-2 py-1 rounded-lg text-[11px] font-bold ${lang === l ? "bg-stone-900 text-white" : "text-stone-600"}`
          }, l === "en" ? "EN" : l === "hi" ? "हिं" : "मरा"))
        )
      )
    ),
    // Hero
    React.createElement("div", { className: "max-w-4xl mx-auto px-4 pt-4" },
      React.createElement("div", { className: "bg-gradient-to-r from-stone-900 to-amber-950 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6" },
        React.createElement("div", { className: "text-center md:text-left" },
          React.createElement("h2", { className: "text-2xl font-black" }, "Scan, Order & Enjoy!"),
          React.createElement("p", { className: "text-xs text-stone-300 mt-1 max-w-sm" }, "Browse our menu, add to cart and order directly to the kitchen.")
        ),
        React.createElement("div", { className: "flex flex-col items-center gap-2 shrink-0" },
          React.createElement("div", { className: "bg-white/10 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/20 text-center" },
            React.createElement("span", { className: "text-[10px] text-amber-300 uppercase tracking-widest font-bold block" }, "Seated at"),
            React.createElement("span", { className: "text-2xl font-black font-mono block" }, `Table ${tableNumber}`)
          ),
          React.createElement("button", {
              onClick: handleCallWaiter, disabled: waiterCalled,
              className: waiterCalled ? "px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600" : "px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-stone-900"
            }, waiterCalled ? "✓ Waiter Notified" : "🔔 Call Waiter")
        )
      )
    ),
    // Search & Categories
    React.createElement("div", { className: "max-w-4xl mx-auto px-4 mt-6 space-y-4" },
      React.createElement("input", {
        type: "text", placeholder: "Search dishes...", value: searchQuery, onChange: e => setSearchQuery(e.target.value),
        className: "w-full px-4 py-3 bg-white border border-stone-200 rounded-2xl text-xs font-medium focus:ring-2 focus:ring-amber-600 outline-none"
      }),
      React.createElement("div", { className: "flex gap-2 overflow-x-auto no-scrollbar pb-1" },
        categories.map(cat => React.createElement("button", {
          key: cat, onClick: () => setSelectedCategory(cat),
          className: `px-4 py-2 rounded-2xl text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? "bg-stone-900 text-white" : "bg-white border text-stone-700"}`
        }, cat))
      )
    ),
    // Menu List
    React.createElement("div", { className: "max-w-4xl mx-auto px-4 mt-6" },
      loading ? React.createElement("p", { className: "text-center text-xs" }, "Loading...") :
      React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-4" },
        filteredItems.map(item => {
          const cartItem = cart.find(i => i.id === item.id);
          return React.createElement("div", { key: item.id, className: "bg-white rounded-3xl p-3.5 border border-stone-200 shadow-sm flex gap-4" },
            React.createElement("img", { src: item.image || item.imageUrl, className: "w-24 h-24 rounded-2xl object-cover" }),
            React.createElement("div", { className: "flex-1 flex flex-col justify-between" },
              React.createElement("div", null,
                React.createElement("h3", { className: "font-black text-sm truncate" }, item.name),
                React.createElement("p", { className: "text-xs font-bold text-amber-700 mt-1" }, `₹${item.price}`)
              ),
              cartItem ? React.createElement("div", { className: "flex items-center gap-3 bg-amber-50 rounded-xl p-1 w-max" },
                React.createElement("button", { onClick: () => updateCartQty(item.id, -1), className: "w-6 h-6 bg-white rounded-lg font-black" }, "-"),
                React.createElement("span", { className: "text-xs font-black" }, cartItem.qty),
                React.createElement("button", { onClick: () => updateCartQty(item.id, 1), className: "w-6 h-6 bg-amber-600 text-white rounded-lg font-black" }, "+")
              ) : React.createElement("button", { onClick: () => addToCart(item), className: "bg-stone-900 text-white text-xs font-bold py-1.5 px-3 rounded-xl w-max mt-2" }, "+ Add")
            )
          )
        })
      )
    ),
    // Floating Cart
    cartItemCount > 0 && React.createElement("div", { className: "fixed bottom-4 left-4 right-4 max-w-xl mx-auto z-40" },
      React.createElement("div", { onClick: () => setIsCartOpen(true), className: "bg-stone-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer" },
        React.createElement("div", { className: "flex items-center gap-3" },
          React.createElement("div", { className: "w-8 h-8 rounded-xl bg-amber-500 text-stone-900 font-black flex items-center justify-center" }, cartItemCount),
          React.createElement("span", { className: "text-xs font-bold" }, "View Cart")
        ),
        React.createElement("span", { className: "font-black text-amber-400 text-sm" }, `₹${grandTotal.toFixed(2)}`)
      )
    ),
    // Cart Modal
    isCartOpen && React.createElement("div", { className: "fixed inset-0 bg-black/60 z-50 flex justify-end" },
      React.createElement("div", { className: "bg-white w-full max-w-md h-full p-6 flex flex-col justify-between overflow-y-auto" },
        React.createElement("div", null,
          React.createElement("div", { className: "flex justify-between items-center pb-4 border-b" },
            React.createElement("h2", { className: "font-black text-lg" }, "Your Bag"),
            React.createElement("button", { onClick: () => setIsCartOpen(false), className: "font-bold text-stone-400" }, "✕")
          ),
          cart.map(item => React.createElement("div", { key: item.id, className: "flex justify-between items-center py-3 border-b text-xs" },
            React.createElement("div", null,
              React.createElement("h4", { className: "font-bold" }, item.name),
              React.createElement("p", { className: "text-amber-700 font-bold" }, `₹${item.price * item.qty}`)
            ),
            React.createElement("div", { className: "flex items-center gap-2" },
              React.createElement("button", { onClick: () => updateCartQty(item.id, -1), className: "w-6 h-6 bg-stone-100 rounded-lg" }, "-"),
              React.createElement("span", { className: "font-bold" }, item.qty),
              React.createElement("button", { onClick: () => updateCartQty(item.id, 1), className: "w-6 h-6 bg-amber-600 text-white rounded-lg" }, "+")
            )
          )),
          React.createElement("textarea", {
            placeholder: "Special instructions...", value: specialInstructions, onChange: e => setSpecialInstructions(e.target.value),
            className: "w-full bg-stone-50 border rounded-xl p-3 text-xs mt-4 outline-none"
          })
        ),
        React.createElement("div", { className: "pt-4 border-t" },
          React.createElement("div", { className: "flex justify-between font-black mb-4" }, React.createElement("span", null, "Total"), React.createElement("span", { className: "text-amber-700" }, `₹${grandTotal.toFixed(2)}`)),
          React.createElement("button", { onClick: handlePlaceOrder, disabled: isOrderSubmitting, className: "w-full bg-amber-600 text-white font-bold py-3 rounded-xl" }, isOrderSubmitting ? "Sending..." : "Place Order")
        )
      )
    ),
    // Success Modal
    showSuccessModal && React.createElement("div", { className: "fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" },
      React.createElement("div", { className: "bg-white p-6 rounded-3xl text-center space-y-4 w-full max-w-sm" },
        React.createElement("div", { className: "w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl mx-auto" }, "✓"),
        React.createElement("h2", { className: "font-black text-xl" }, "Order Sent!"),
        React.createElement("p", { className: "text-xs text-stone-500" }, "Your food is being prepared."),
        React.createElement("button", { onClick: () => setShowSuccessModal(false), className: "w-full bg-stone-900 text-white py-3 rounded-xl font-bold text-xs" }, "Close")
      )
    )
  );
}

// --- KITCHEN DASHBOARD (No Scroll, Tabs) ---
function KitchenDashboard({ restaurant, onLogout }) {
  const [orders, setOrders] = useState([]);
  const [waiterCalls, setWaiterCalls] = useState([]);
  const [activeTab, setActiveTab] = useState("PENDING"); // Tabs: PENDING, PREPARING, COMPLETED
  const targetRestId = restaurant?.id || "rest-101";

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    const unsubOrders = onSnapshot(collection(db, "restaurants", targetRestId, "orders"), snap => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      setOrders(list);
    });
    const unsubWaiter = onSnapshot(collection(db, "restaurants", targetRestId, "waiterCalls"), snap => {
      const calls = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.resolved);
      setWaiterCalls(calls);
    });
    return () => { unsubOrders(); unsubWaiter(); };
  }, [targetRestId]);

  const updateStatus = async (orderId, newStatus) => {
    if (isFirebaseAvailable && db) {
      await updateDoc(doc(db, "restaurants", targetRestId, "orders", orderId), { status: newStatus });
    }
  };

  const resolveCall = async (callId) => {
    if (isFirebaseAvailable && db) {
      await updateDoc(doc(db, "restaurants", targetRestId, "waiterCalls", callId), { resolved: true });
    }
  };

  const pending = orders.filter(o => o.status === "PENDING");
  const preparing = orders.filter(o => o.status === "PREPARING");
  const completed = orders.filter(o => o.status === "COMPLETED");

  const renderOrders = (list, label, nextStatus, btnColor) => {
    if (list.length === 0) return React.createElement("p", { className: "text-xs text-stone-400 text-center py-10" }, "No orders in this list.");
    return list.map(o => React.createElement("div", { key: o.id, className: "bg-stone-800 rounded-2xl p-4 mb-3 border border-stone-700 space-y-3" },
      React.createElement("div", { className: "flex justify-between items-center border-b border-stone-700 pb-2" },
        React.createElement("span", { className: "font-black text-amber-400 text-sm" }, o.tokenNumber),
        React.createElement("span", { className: "bg-stone-700 text-xs px-2 py-1 rounded-lg font-bold" }, `Table ${o.tableNumber}`)
      ),
      React.createElement("div", { className: "space-y-1" }, o.items.map((i, idx) => React.createElement("div", { key: idx, className: "flex justify-between text-xs text-stone-200" },
        React.createElement("span", null, `${i.qty}x ${i.name}`), React.createElement("span", { className: "font-mono text-stone-400" }, `₹${i.price * i.qty}`)
      ))),
      o.specialInstructions && React.createElement("div", { className: "bg-stone-900/50 p-2 text-[10px] text-amber-200 border-l-2 border-amber-500" }, `⚠️ ${o.specialInstructions}`),
      nextStatus && React.createElement("button", { onClick: () => updateStatus(o.id, nextStatus), className: `w-full py-2 rounded-xl text-xs font-bold text-white ${btnColor}` }, label)
    ));
  };

  return React.createElement("div", { className: "min-h-screen bg-stone-900 text-stone-100 flex flex-col" },
    // Header
    React.createElement("div", { className: "p-4 border-b border-stone-800 flex justify-between items-center" },
      React.createElement("div", null,
        React.createElement("h1", { className: "text-xl font-black text-white" }, "Kitchen Display"),
        React.createElement("p", { className: "text-xs text-stone-400" }, restaurant.name)
      ),
      React.createElement("button", { onClick: onLogout, className: "text-xs bg-stone-800 px-3 py-1.5 rounded-lg" }, "Exit")
    ),
    // Waiter Alerts
    waiterCalls.length > 0 && React.createElement("div", { className: "m-4 p-3 bg-amber-500/10 border border-amber-500 rounded-2xl flex flex-wrap gap-2 items-center" },
      React.createElement("span", { className: "text-xs font-black text-amber-400" }, "🔔 WAITER CALLS:"),
      waiterCalls.map(c => React.createElement("div", { key: c.id, className: "bg-amber-500 text-stone-900 px-3 py-1 rounded-xl text-xs font-bold flex items-center gap-2" },
        `Table ${c.tableNumber}`, React.createElement("button", { onClick: () => resolveCall(c.id), className: "bg-stone-900 text-white w-4 h-4 rounded-full flex items-center justify-center text-[10px]" }, "✓")
      ))
    ),
    // TABS
    React.createElement("div", { className: "flex border-b border-stone-800" },
      [
        { id: "PENDING", label: `Pending (${pending.length})`, color: "text-amber-400 border-amber-400" },
        { id: "PREPARING", label: `Cooking (${preparing.length})`, color: "text-blue-400 border-blue-400" },
        { id: "COMPLETED", label: `Done (${completed.length})`, color: "text-emerald-400 border-emerald-400" }
      ].map(tab => React.createElement("button", {
          key: tab.id, onClick: () => setActiveTab(tab.id),
          className: `flex-1 py-3 text-xs font-black transition-colors border-b-2 ${activeTab === tab.id ? tab.color : "text-stone-500 border-transparent"}`
        }, tab.label)
      )
    ),
    // LIST (Based on Tab)
    React.createElement("div", { className: "flex-1 overflow-y-auto p-4" },
      activeTab === "PENDING" && renderOrders(pending, "Start Cooking →", "PREPARING", "bg-amber-600 hover:bg-amber-500"),
      activeTab === "PREPARING" && renderOrders(preparing, "Mark Ready ✓", "COMPLETED", "bg-emerald-600 hover:bg-emerald-500"),
      activeTab === "COMPLETED" && renderOrders(completed, null, null, "")
    )
  );
}

// --- OWNER DASHBOARD (Compact & Professional, with Waiter Calls) ---
function OwnerDashboard({ restaurant, onLogout }) {
  const [menuItems, setMenuItems] = useState([]);
  const [orders, setOrders] = useState([]);
  const [waiterCalls, setWaiterCalls] = useState([]);
  const [showAddModal, setShowAddModal] = useState(false);
  const targetRestId = restaurant?.id || "rest-101";

  const [newItem, setNewItem] = useState({ name: "", price: "", description: "", type: "Veg", category: "Mains", image: "" });

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    const unsubMenu = onSnapshot(collection(db, "restaurants", targetRestId, "menuItems"), snap => setMenuItems(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
    const unsubOrders = onSnapshot(collection(db, "restaurants", targetRestId, "orders"), snap => setOrders(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
    const unsubWaiter = onSnapshot(collection(db, "restaurants", targetRestId, "waiterCalls"), snap => setWaiterCalls(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.resolved)));
    return () => { unsubMenu(); unsubOrders(); unsubWaiter(); };
  }, [targetRestId]);

  const resolveCall = async (callId) => {
    if (isFirebaseAvailable && db) await updateDoc(doc(db, "restaurants", targetRestId, "waiterCalls", callId), { resolved: true });
  };

  const handleAddItem = async (e) => {
    e.preventDefault();
    if (isFirebaseAvailable && db) {
      await addDoc(collection(db, "restaurants", targetRestId, "menuItems"), {
        ...newItem, price: parseFloat(newItem.price), isVegetarian: newItem.type === "Veg", available: true, imageUrl: newItem.image
      });
    }
    setShowAddModal(false); setNewItem({ name: "", price: "", description: "", type: "Veg", category: "Mains", image: "" });
  };

  const handleDeleteItem = async (id) => {
    if (isFirebaseAvailable && db) await deleteDoc(doc(db, "restaurants", targetRestId, "menuItems", id));
  };

  const todaysOrders = orders.filter(o => o.createdAt?.startsWith(new Date().toISOString().split("T")[0]));
  const todaysRevenue = todaysOrders.reduce((s, o) => s + (o.totalAmount || 0), 0);
  const daysLeft = getDaysRemaining(restaurant.dueDate);

  return React.createElement("div", { className: "max-w-4xl mx-auto p-4 md:p-6 font-sans pb-20" },
    // Header
    React.createElement("div", { className: "flex justify-between items-center mb-6" },
      React.createElement("div", null,
        React.createElement("h1", { className: "text-xl font-black" }, restaurant.name),
        React.createElement("p", { className: "text-xs text-stone-500" }, "Owner Dashboard")
      ),
      React.createElement("div", { className: "flex gap-2" },
        React.createElement("button", { onClick: onLogout, className: "bg-stone-200 px-4 py-2 rounded-xl text-xs font-bold" }, "Exit")
      )
    ),

    // Waiter Alerts (Owner Side)
    waiterCalls.length > 0 && React.createElement("div", { className: "mb-6 p-4 bg-amber-100 border border-amber-300 rounded-2xl flex flex-wrap gap-3 items-center shadow-sm" },
      React.createElement("span", { className: "text-xs font-black text-amber-800" }, "🔔 WAITER CALLS:"),
      waiterCalls.map(c => React.createElement("div", { key: c.id, className: "bg-amber-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-sm" },
        `Table ${c.tableNumber}`, React.createElement("button", { onClick: () => resolveCall(c.id), className: "bg-white text-amber-900 w-5 h-5 rounded-full flex items-center justify-center" }, "✓")
      ))
    ),

    // Stats (Compact side-by-side)
    React.createElement("div", { className: "grid grid-cols-2 gap-3 mb-6" },
      React.createElement("div", { className: "bg-white p-4 rounded-2xl border border-stone-200" },
        React.createElement("span", { className: "text-[10px] text-stone-500 font-bold uppercase" }, "Today's Revenue"),
        React.createElement("p", { className: "text-xl font-black text-amber-700 mt-1" }, `₹${todaysRevenue.toFixed(2)}`)
      ),
      React.createElement("div", { className: "bg-white p-4 rounded-2xl border border-stone-200" },
        React.createElement("span", { className: "text-[10px] text-stone-500 font-bold uppercase" }, "Today's Orders"),
        React.createElement("p", { className: "text-xl font-black text-stone-900 mt-1" }, todaysOrders.length)
      )
    ),

    // Plan Banner
    React.createElement("div", { className: "bg-emerald-50 border border-emerald-200 p-3 rounded-xl mb-6 flex justify-between items-center text-xs" },
      React.createElement("span", { className: "font-bold text-emerald-800" }, `Active Plan (${daysLeft} days left)`),
      React.createElement("button", { onClick: () => alert("Plan Active!"), className: "bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold" }, "Extend")
    ),

    // Menu Catalog
    React.createElement("div", { className: "flex justify-between items-center mb-4" },
      React.createElement("h2", { className: "font-black text-lg" }, `Menu (${menuItems.length})`),
      React.createElement("button", { onClick: () => setShowAddModal(true), className: "bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold" }, "+ Add Dish")
    ),
    React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-3" },
      menuItems.map(item => React.createElement("div", { key: item.id, className: "bg-white p-3 rounded-2xl border flex gap-3 items-center" },
        React.createElement("img", { src: item.imageUrl || item.image, className: "w-16 h-16 rounded-xl object-cover" }),
        React.createElement("div", { className: "flex-1" },
          React.createElement("h4", { className: "font-bold text-sm truncate" }, item.name),
          React.createElement("p", { className: "text-xs font-bold text-amber-700" }, `₹${item.price}`),
          React.createElement("button", { onClick: () => handleDeleteItem(item.id), className: "text-[10px] text-red-500 mt-1" }, "Delete")
        )
      ))
    ),

    // Add Modal
    showAddModal && React.createElement("div", { className: "fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" },
      React.createElement("form", { onSubmit: handleAddItem, className: "bg-white p-6 rounded-3xl w-full max-w-sm space-y-3" },
        React.createElement("h3", { className: "font-black" }, "Add Dish"),
        React.createElement("input", { required: true, type: "text", placeholder: "Dish Name", value: newItem.name, onChange: e => setNewItem({ ...newItem, name: e.target.value }), className: "w-full border p-2 rounded-xl text-sm" }),
        React.createElement("input", { required: true, type: "number", placeholder: "Price", value: newItem.price, onChange: e => setNewItem({ ...newItem, price: e.target.value }), className: "w-full border p-2 rounded-xl text-sm" }),
        React.createElement("input", { type: "text", placeholder: "Image URL", value: newItem.image, onChange: e => setNewItem({ ...newItem, image: e.target.value }), className: "w-full border p-2 rounded-xl text-sm" }),
        React.createElement("div", { className: "flex gap-2" },
          React.createElement("button", { type: "button", onClick: () => setShowAddModal(false), className: "flex-1 bg-stone-100 p-2 rounded-xl text-sm font-bold" }, "Cancel"),
          React.createElement("button", { type: "submit", className: "flex-1 bg-amber-600 text-white p-2 rounded-xl text-sm font-bold" }, "Save")
        )
      )
    )
  );
}

// --- SUPER ADMIN DASHBOARD ---
function SuperAdminDashboard({ restaurants, onLogout, setRestaurants }) {
  return React.createElement("div", { className: "max-w-4xl mx-auto p-4" },
    React.createElement("div", { className: "flex justify-between items-center mb-6" },
      React.createElement("h1", { className: "text-xl font-black" }, "Super Admin"),
      React.createElement("button", { onClick: onLogout, className: "bg-stone-200 px-4 py-2 rounded-xl text-xs font-bold" }, "Exit")
    ),
    React.createElement("div", { className: "space-y-4" },
      restaurants.map(r => React.createElement("div", { key: r.id, className: "bg-white p-4 rounded-xl border flex justify-between items-center" },
        React.createElement("div", null, React.createElement("h4", { className: "font-bold" }, r.name), React.createElement("p", { className: "text-xs text-stone-500" }, `ID: ${r.id}`)),
        React.createElement("div", { className: "text-xs font-mono" }, `Owner: ${r.ownerPin} | Kitchen: ${r.kitchenPin}`)
      ))
    )
  );
}

function PinLoginModal({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const handleDigit = (d) => { if (pin.length < 6) setPin(p => p + d); };
  const handleLogin = () => {
    if (pin === "999999") return onSuccess({ role: "admin" });
    const cur = restaurants.find(r => r.id === defaultRestId);
    if (cur && cur.ownerPin === pin) return onSuccess({ role: "owner", restaurantId: cur.id });
    if (cur && cur.kitchenPin === pin) return onSuccess({ role: "kitchen", restaurantId: cur.id });
    if (pin === "111111") return onSuccess({ role: "owner", restaurantId: "rest-101" });
    if (pin === "222222") return onSuccess({ role: "kitchen", restaurantId: "rest-101" });
    alert("Invalid PIN");
  };
  return React.createElement("div", { className: "fixed inset-0 bg-black/60 flex items-center justify-center p-4" },
    React.createElement("div", { className: "bg-white p-6 rounded-3xl w-full max-w-xs text-center space-y-4" },
      React.createElement("h2", { className: "font-black text-lg" }, "Staff Login"),
      React.createElement("div", { className: "flex justify-center gap-1" }, [0,1,2,3,4,5].map(i => React.createElement("div", { key: i, className: `w-8 h-10 border rounded-lg flex items-center justify-center font-bold ${pin[i] ? "bg-amber-50" : ""}` }, pin[i] ? "•" : ""))),
      React.createElement("div", { className: "grid grid-cols-3 gap-2" },
        [1,2,3,4,5,6,7,8,9].map(n => React.createElement("button", { key: n, onClick: () => handleDigit(n.toString()), className: "bg-stone-50 py-2 rounded-xl font-bold" }, n)),
        React.createElement("button", { onClick: () => setPin(""), className: "bg-stone-50 py-2 rounded-xl text-xs" }, "Clear"),
        React.createElement("button", { onClick: () => handleDigit("0"), className: "bg-stone-50 py-2 rounded-xl font-bold" }, "0"),
        React.createElement("button", { onClick: () => setPin(p => p.slice(0, -1)), className: "bg-stone-50 py-2 rounded-xl text-xs" }, "⌫")
      ),
      React.createElement("button", { onClick: handleLogin, disabled: pin.length < 6, className: "w-full bg-amber-600 text-white py-3 rounded-xl font-bold disabled:opacity-50" }, "Verify"),
      React.createElement("button", { onClick: onCancel, className: "text-xs text-stone-500 mt-2" }, "Cancel")
    )
  );
}

const container = document.getElementById("root");
const root = createRoot(container);
root.render(React.createElement(App));
