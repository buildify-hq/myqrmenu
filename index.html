    <script type="module">
import { createRoot } from "react-dom/client";
import React, { useState, useEffect, useMemo } from "react";

// Firebase CDN Initialization
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyDL_AyEqLAZ7mafIN3J5AMV2n3uShEeW8",
  authDomain: "menu-qr-b8765.firebaseapp.com",
  projectId: "menu-qr-b8765",
  storageBucket: "menu-qr-b8765.firebasestorage.app",
  messagingSenderId: "71280897038",
  appId: "1:71280897038:web:180294fd94d32e6f11205f",
  measurementId: "G-TNKM262EVG"
};

var app = null;
var db = null;
var isFirebaseAvailable = false;
try {
  app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
  db = getFirestore(app);
  isFirebaseAvailable = true;
  console.log("✅ Firebase Firestore initialized successfully");
} catch (err) {
  console.warn("⚠️ Firebase init warning - running in resilient offline fallback mode:", err);
  isFirebaseAvailable = false;
}

// Sound Utility
const playBeep = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    gain.gain.setValueAtTime(1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);
  } catch(e) { console.log("Audio block"); }
};

// ==========================================
// 1. DEFAULT RESTAURANTS (Default ID: 'rest-101')
// ==========================================
const DEFAULT_RESTAURANTS = [
  {
    id: "rest-101",
    name: "Sagar's Cafe",
    tagline: "Fresh Brews, Delicious Bites & More",
    ownerPin: "111111",
    kitchenPin: "222222",
    subscriptionStatus: "ACTIVE",
    dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
    isKitchenOpen: true,
    taxPercentage: 5,
    showTax: true,
  },
  {
    id: "rest-102",
    name: "Spice Craft Bistro",
    tagline: "Modern Indian Fusion & Tandoor Grill",
    ownerPin: "333333",
    kitchenPin: "444444",
    subscriptionStatus: "EXPIRED",
    dueDate: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
    isKitchenOpen: true,
    taxPercentage: 5,
    showTax: true,
  }
];

function getDaysRemaining(dueDateStr) {
  if (!dueDateStr) return 0;
  const due = new Date(dueDateStr);
  const now = new Date();
  const diffTime = due.getTime() - now.getTime();
  return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
}

// ==========================================
// 2. MAIN APP ROOT ROUTER
// ==========================================
export default function App() {
  const queryParams = new URLSearchParams(window.location.search);
  const urlRestId = queryParams.get("restId") || queryParams.get("restaurantId") || "rest-101";
  const urlTable = parseInt(queryParams.get("table") || "5", 10);

  const isStaffInitial = 
    window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
    queryParams.get("staff") === "true" ||
    queryParams.get("view") === "staff";

  const [currentRestId, setCurrentRestId] = useState(urlRestId);
  const [currentTable, setCurrentTable] = useState(urlTable);
  const [restaurants, setRestaurants] = useState(DEFAULT_RESTAURANTS);
  const [currentView, setCurrentView] = useState(isStaffInitial ? "login" : "customer");
  const [userSession, setUserSession] = useState(null);

  useEffect(() => {
    const checkStaffRoute = () => {
      const sp = new URLSearchParams(window.location.search);
      const isStaff =
        window.location.pathname.toLowerCase().replace(/\/+$/, "").endsWith("/staff") ||
        sp.get("staff") === "true" ||
        sp.get("view") === "staff";
      if (isStaff) {
        setCurrentView("login");
      }
    };
    checkStaffRoute();
    window.addEventListener("popstate", checkStaffRoute);
    return () => window.removeEventListener("popstate", checkStaffRoute);
  }, []);

  useEffect(() => {
    if (!isFirebaseAvailable || !db) return;
    try {
      const unsub = onSnapshot(
        collection(db, "restaurants"),
        (snapshot) => {
          if (!snapshot.empty) {
            const firestoreList = snapshot.docs.map((docSnap) => ({
              id: docSnap.id,
              ...docSnap.data(),
            }));
            setRestaurants((prev) => {
              const map = new Map();
              DEFAULT_RESTAURANTS.forEach((r) => map.set(r.id, r));
              prev.forEach((r) => map.set(r.id, r));
              firestoreList.forEach((r) => map.set(r.id, { ...map.get(r.id), ...r }));
              return Array.from(map.values());
            });
          }
        },
        (err) => {
          console.warn("[App] Firestore restaurants listener note:", err);
        }
      );
      return () => unsub();
    } catch (err) {
      console.warn("[App] Exception setting up restaurants listener:", err);
    }
  }, []);

  const handleAddRestaurant = (newRest) => {
    setRestaurants((prev) => {
      const exists = prev.some(
        (r) => r.id === newRest.id || (r.name && newRest.name && r.name.toLowerCase() === newRest.name.toLowerCase())
      );
      if (exists) {
        return prev.map((r) => (r.id === newRest.id ? { ...r, ...newRest } : r));
      }
      return [newRest, ...prev];
    });
  };

  const handleReturnToCustomer = () => {
    if (
      window.location.pathname.toLowerCase().includes("/staff") ||
      window.location.search.includes("view=staff") ||
      window.location.search.includes("staff=true")
    ) {
      window.history.pushState({}, "", `/?restId=${currentRestId}&table=${currentTable}`);
    }
    setCurrentView("customer");
  };

  const currentRestaurant = useMemo(() => {
    return restaurants.find((r) => r.id === currentRestId) || {
      id: currentRestId,
      name: "Restaurant " + currentRestId,
      tagline: "Live Dining & QR Ordering",
      ownerPin: "111111",
      kitchenPin: "222222",
      subscriptionStatus: "ACTIVE",
      dueDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0],
      isKitchenOpen: true,
      taxPercentage: 5,
      showTax: true,
    };
  }, [restaurants, currentRestId]);

  const handleRenewSubscription = async (restId) => {
    const currentRest = restaurants.find((r) => r.id === restId);
    const currentDue = currentRest?.dueDate ? new Date(currentRest.dueDate) : new Date();
    const baseDate = currentDue > new Date() ? currentDue : new Date();
    const newDueDate = new Date(baseDate.getTime() + 30 * 24 * 60 * 60 * 1000)
      .toISOString()
      .split("T")[0];

    setRestaurants((prev) =>
      prev.map((r) => {
        if (r.id === restId) {
          return {
            ...r,
            subscriptionStatus: "ACTIVE",
            dueDate: newDueDate,
          };
        }
        return r;
      })
    );

    if (isFirebaseAvailable && db) {
      try {
        await updateDoc(doc(db, "restaurants", restId), {
          subscriptionStatus: "ACTIVE",
          dueDate: newDueDate,
        });
      } catch (e) {
        console.warn("Could not update subscription in Firestore:", e);
      }
    }
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-stone-50 text-stone-900 font-sans antialiased selection:bg-amber-100 selection:text-amber-900" },
    currentView === "customer" &&
      React.createElement(CustomerView, {
        restaurant: currentRestaurant,
        tableNumber: currentTable
      }),
    currentView === "login" &&
      React.createElement(PinLoginModal, {
        restaurants,
        defaultRestId: currentRestId,
        onSuccess: (session) => {
          setUserSession(session);
          if (session.role === "admin") setCurrentView("admin");
          else if (session.role === "owner") {
            setCurrentRestId(session.restaurantId);
            setCurrentView("owner");
          } else if (session.role === "kitchen") {
            setCurrentRestId(session.restaurantId);
            setCurrentView("kitchen");
          }
        },
        onCancel: handleReturnToCustomer,
      }),
    currentView === "owner" &&
      React.createElement(OwnerDashboard, {
        restaurant: currentRestaurant,
        onLogout: handleReturnToCustomer,
      }),
    currentView === "kitchen" &&
      React.createElement(KitchenDashboard, {
        restaurant: currentRestaurant,
        onLogout: handleReturnToCustomer,
      }),
    currentView === "admin" &&
      React.createElement(SuperAdminDashboard, {
        restaurants,
        onRenew: handleRenewSubscription,
        onAddRestaurant: handleAddRestaurant,
        onLogout: handleReturnToCustomer,
        setRestaurants: setRestaurants
      })
  );
}

// ==========================================
// 3. CUSTOMER VIEW & DIGITAL MENU
// ==========================================
function CustomerView({ restaurant, tableNumber }) {
  const searchParams = new URLSearchParams(window.location.search);
  const restaurantId = searchParams.get("restId") || searchParams.get("restaurantId") || (restaurant && restaurant.id) || "rest-101";

  const [menuItems, setMenuItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fetchError, setFetchError] = useState(null);
  const [cart, setCart] = useState([]);
  const [selectedCategory, setSelectedCategory] = useState("All");
  const [searchQuery, setSearchQuery] = useState("");
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [placedOrder, setPlacedOrder] = useState(null);
  const [isOrderSubmitting, setIsOrderSubmitting] = useState(false);
  const [specialInstructions, setSpecialInstructions] = useState("");
  const [showSuccessModal, setShowSuccessModal] = useState(false);
  const [showWaiterPopup, setShowWaiterPopup] = useState(false);

  // Live active order tracking state
  const [activeOrderId, setActiveOrderId] = useState(null);
  const [liveOrderStatus, setLiveOrderStatus] = useState(null);

  const mapDocToItem = (id, data) => ({
    id: id || data.id,
    name: data.name || data.title || "Untitled Dish",
    description: data.description || data.desc || "",
    price: typeof data.price === "number" ? data.price : parseFloat(data.price) || 0,
    category: data.category || "Mains",
    imageUrl: data.image || data.imageUrl || "https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=600&q=80",
    isVegetarian: data.type === "veg" || Boolean(data.isVegetarian),
    isSpicy: Boolean(data.isSpicy),
    tag: data.isSpecial ? "Special" : data.tag || data.seasonalTag || null,
    prepTime: data.prepTime || "15 mins",
    available: data.available !== false,
  });

  useEffect(() => {
    let unsubscribe = () => {};
    let isMounted = true;
    setLoading(true);

    if (isFirebaseAvailable && db) {
      try {
        const menuColRef = collection(db, "restaurants", restaurantId, "menuItems");
        unsubscribe = onSnapshot(
          menuColRef,
          (snapshot) => {
            if (!isMounted) return;
            const items = snapshot.docs.map((docSnap) => mapDocToItem(docSnap.id, docSnap.data()));
            setMenuItems(items);
            setLoading(false);
          },
          (err) => {
            console.warn("[CustomerView] onSnapshot error:", err);
            if (isMounted) setLoading(false);
          }
        );
      } catch (err) {
        if (isMounted) setLoading(false);
      }
    } else {
      setLoading(false);
    }

    return () => { isMounted = false; unsubscribe(); };
  }, [restaurantId]);

  useEffect(() => {
    if (!activeOrderId || !isFirebaseAvailable || !db) return;
    try {
      const orderRef = doc(db, "restaurants", restaurantId, "orders", activeOrderId);
      const unsubOrder = onSnapshot(orderRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          setLiveOrderStatus({
            id: docSnap.id,
            tokenNumber: data.tokenNumber || "TB-100",
            status: (data.status || "PENDING").toUpperCase(),
          });
        }
      });
      return () => unsubOrder();
    } catch (e) {}
  }, [activeOrderId, restaurantId]);

  const handleCallWaiter = async () => {
    setShowWaiterPopup(true);
    setTimeout(() => setShowWaiterPopup(false), 3000);
    if (isFirebaseAvailable && db) {
      try {
        await addDoc(collection(db, "restaurants", restaurantId, "waiterCalls"), {
          tableNumber: tableNumber,
          status: "PENDING",
          time: new Date().toISOString(),
          timestamp: Date.now()
        });
      } catch (err) {}
    }
  };

  const categories = ["All", "Veg", "Non-Veg", "Mains", "Snacks", "Drinks", "Ice Cream", "Desserts"];
  const filteredItems = useMemo(() => {
    return menuItems.filter((item) => {
      if (item.available === false) return false;
      const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || item.description.toLowerCase().includes(searchQuery.toLowerCase());
      let matchCategory = true;
      if (selectedCategory === "All") matchCategory = true;
      else if (selectedCategory === "Veg") matchCategory = item.isVegetarian === true;
      else if (selectedCategory === "Non-Veg") matchCategory = item.isVegetarian === false;
      else matchCategory = item.category === selectedCategory;
      return matchCategory && matchSearch;
    });
  }, [menuItems, selectedCategory, searchQuery]);

  const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);
  const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const activeTaxPercent = restaurant.taxPercentage !== undefined ? Number(restaurant.taxPercentage) : 5;
  const taxAmount = cartSubtotal * (activeTaxPercent / 100);
  const grandTotal = cartSubtotal + taxAmount;

  const addToCart = (item) => {
    setCart((prev) => {
      const existing = prev.find((i) => i.id === item.id);
      if (existing) return prev.map((i) => (i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { ...item, qty: 1 }];
    });
  };

  const updateCartQty = (id, delta) => {
    setCart((prev) => {
      return prev.map((i) => {
        if (i.id === id) {
          const newQty = i.qty + delta;
          return newQty > 0 ? { ...i, qty: newQty } : null;
        }
        return i;
      }).filter(Boolean);
    });
  };

  const handlePlaceOrder = async () => {
    if (cart.length === 0 || isOrderSubmitting) return;
    setIsOrderSubmitting(true);

    const tokenNumber = "TB-" + Math.floor(100 + Math.random() * 900);
    const orderPayload = {
      tokenNumber,
      tableNumber: tableNumber || 1,
      items: cart.map((i) => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
      totalAmount: grandTotal,
      specialInstructions: specialInstructions.trim(),
      status: "PENDING",
      createdAt: new Date().toISOString(),
      timestamp: Date.now(),
    };

    let orderId = "ord_" + Date.now();
    if (isFirebaseAvailable && db) {
      try {
        const docRef = await addDoc(collection(db, "restaurants", restaurantId, "orders"), orderPayload);
        orderId = docRef.id;
      } catch (err) {}
    }

    const finalOrder = { id: orderId, ...orderPayload };
    setPlacedOrder(finalOrder);
    setActiveOrderId(orderId);
    setLiveOrderStatus({ id: orderId, tokenNumber, status: "PENDING" });
    setIsOrderSubmitting(false);
    setIsCartOpen(false);
    setShowSuccessModal(true);
    setCart([]);
    setSpecialInstructions("");
  };

  return React.createElement(
    "div",
    { className: "min-h-screen bg-stone-50 pb-28" },
    showWaiterPopup && React.createElement(
      "div",
      { className: "fixed top-20 left-1/2 transform -translate-x-1/2 z-50 bg-amber-600 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 animate-bounce" },
      React.createElement("span", { className: "text-xl" }, "🔔"),
      React.createElement("span", { className: "font-bold text-sm" }, "Waiter is on the way!")
    ),

    React.createElement(
      "header",
      { className: "bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs" },
      React.createElement(
        "div",
        { className: "max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center" },
        React.createElement(
          "div",
          { className: "flex items-center gap-3" },
          React.createElement(
            "div",
            { className: "w-10 h-10 rounded-2xl bg-amber-600 text-white flex items-center justify-center font-black text-lg shadow-sm" },
            restaurant.name ? restaurant.name.charAt(0) : "S"
          ),
          React.createElement(
            "div",
            null,
            React.createElement("h1", { className: "font-black text-base text-stone-900 leading-tight" }, restaurant.name),
            React.createElement(
              "div",
              { className: "flex items-center gap-2 text-xs text-stone-500 mt-0.5" },
              React.createElement("span", { className: "font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200/60" }, `Table ${tableNumber}`)
            )
          )
        ),
        React.createElement(
          "button",
          {
            onClick: handleCallWaiter,
            className: "flex items-center gap-1.5 bg-amber-100 text-amber-800 px-3 py-2 rounded-xl text-xs font-bold border border-amber-200 hover:bg-amber-200 transition-colors shadow-sm"
          },
          React.createElement("span", null, "🔔"),
          React.createElement("span", { className: "hidden sm:inline" }, "Call Waiter")
        )
      )
    ),

    liveOrderStatus && React.createElement(
      "div",
      { className: "max-w-4xl mx-auto px-4 pt-4" },
      React.createElement(
        "div",
        { className: "bg-stone-900 text-white rounded-2xl p-4 shadow-lg flex items-center justify-between gap-4" },
        React.createElement(
          "div",
          { className: "flex items-center gap-3" },
          React.createElement("div", { className: "w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0" }, "📡"),
          React.createElement(
            "div",
            null,
            React.createElement("div", { className: "text-[10px] uppercase font-black tracking-widest text-amber-400" }, `Live Order • ${liveOrderStatus.tokenNumber}`),
            React.createElement(
              "div",
              { className: "text-sm font-black flex items-center gap-2 mt-0.5" },
              liveOrderStatus.status === "PENDING" && React.createElement("span", { className: "text-red-400" }, "🔴 Pending KOT"),
              liveOrderStatus.status === "PREPARING" && React.createElement("span", { className: "text-amber-300" }, "🟡 Preparing"),
              liveOrderStatus.status === "COMPLETED" && React.createElement("span", { className: "text-emerald-400" }, "🟢 Served")
            )
          )
        ),
        React.createElement("button", { onClick: () => setLiveOrderStatus(null), className: "text-xs bg-white/10 px-3 py-1.5 rounded-lg font-bold" }, "✕")
      )
    ),

    React.createElement(
      "div",
      { className: "max-w-4xl mx-auto px-4 mt-4 space-y-4" },
      React.createElement(
        "div",
        { className: "relative w-full" },
        React.createElement("span", { className: "absolute left-3.5 top-3 text-stone-400 text-sm" }, "🔍"),
        React.createElement("input", {
          type: "text",
          placeholder: "Search dishes...",
          value: searchQuery,
          onChange: (e) => setSearchQuery(e.target.value),
          className: "w-full pl-10 pr-4 py-2.5 bg-white border border-stone-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 shadow-sm"
        })
      ),
      React.createElement(
        "div",
        { className: "flex gap-2 overflow-x-auto no-scrollbar py-1" },
        categories.map((cat) => React.createElement("button", { key: cat, onClick: () => setSelectedCategory(cat), className: `px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm ${selectedCategory === cat ? "bg-stone-900 text-white" : "bg-white border text-stone-700"}` }, cat))
      )
    ),

    React.createElement(
      "div",
      { className: "max-w-4xl mx-auto px-4 mt-4" },
      loading ? React.createElement("div", { className: "py-20 text-center text-stone-500" }, "Loading...") : filteredItems.length === 0 ? React.createElement("div", { className: "p-12 text-center bg-white rounded-2xl border" }, "No dishes found") : React.createElement(
        "div",
        { className: "grid grid-cols-1 sm:grid-cols-2 gap-4" },
        filteredItems.map((item) => {
          const cartItem = cart.find((i) => i.id === item.id);
          const qtyInCart = cartItem ? cartItem.qty : 0;
          return React.createElement(
            "div",
            { key: item.id, className: "bg-white rounded-2xl p-3 border border-stone-200 shadow-sm flex gap-4 items-center" },
            React.createElement("img", { src: item.imageUrl, alt: item.name, className: "w-24 h-24 rounded-xl object-cover shrink-0" }),
            React.createElement(
              "div",
              { className: "flex-1 min-w-0" },
              React.createElement(
                "div",
                { className: "flex justify-between items-start" },
                React.createElement("h3", { className: "font-black text-sm text-stone-900 truncate" }, item.name),
                React.createElement("span", { className: "text-xs font-bold text-amber-700" }, `₹${item.price}`)
              ),
              React.createElement("p", { className: "text-xs text-stone-500 line-clamp-1 mt-1" }, item.description),
              React.createElement(
                "div",
                { className: "flex items-center justify-between mt-3" },
                React.createElement("span", { className: `text-[10px] font-bold px-2 py-0.5 rounded-full ${item.isVegetarian ? "bg-emerald-50 text-emerald-700" : "bg-rose-50 text-rose-700"}` }, item.isVegetarian ? "Veg" : "Non-Veg"),

// ==========================================
// 6. SUPER ADMIN DASHBOARD (Card UI)

function SuperAdminDashboard({ restaurants, onRenew, onAddRestaurant, onLogout, setRestaurants }) {
  const [activeTab, setActiveTab] = useState("restaurants");
  const [restaurantName, setRestaurantName] = useState("");
  const [generatedResult, setGeneratedResult] = useState(null);
  const [selectedRest, setSelectedRest] = useState(null);

  const handleDeleteRestaurant = async (restId) => {
    if (!window.confirm("Delete restaurant permanently?")) return;
    setRestaurants((prev) => prev.filter((r) => r.id !== restId));
    if (isFirebaseAvailable && db) await deleteDoc(doc(db, "restaurants", restId));
    setSelectedRest(null);
  };

  const handleGeneratePins = async (e) => {
    e.preventDefault();
    if (!restaurantName.trim()) return;
    const genOwnerPin = String(Math.floor(100000 + Math.random() * 900000));
    let genKitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    while (genKitchenPin === genOwnerPin) genKitchenPin = String(Math.floor(100000 + Math.random() * 900000));
    
    const docPayload = {
      name: restaurantName.trim(), ownerPin: genOwnerPin, kitchenPin: genKitchenPin,
      subscriptionStatus: "ACTIVE", dueDate: new Date(Date.now() + 30*24*60*60*1000).toISOString().split("T")[0],
      isKitchenOpen: true, createdAt: new Date().toISOString(), taxPercentage: 5, showTax: true
    };
    let newId = "rest-" + Date.now().toString().slice(-6);
    if (isFirebaseAvailable && db) {
      const docRef = await addDoc(collection(db, "restaurants"), docPayload);
      newId = docRef.id;
    }
    setGeneratedResult({ id: newId, ...docPayload });
    setRestaurantName("");
  };

  return React.createElement(
    "div",
    { className: "max-w-4xl mx-auto p-4 font-sans min-h-screen" },
    React.createElement(
      "header",
      { className: "flex justify-between items-center pb-4 border-b mb-6" },
      React.createElement("h1", { className: "text-xl font-black text-purple-700" }, "Super Admin"),
      React.createElement("button", { onClick: onLogout, className: "px-4 py-2 bg-stone-200 rounded-xl text-xs font-bold" }, "Exit")
    ),
    React.createElement("div", { className: "flex border-b mb-6 gap-2" },
      React.createElement("button", { onClick: () => setActiveTab("restaurants"), className: `pb-2 px-4 font-bold border-b-2 ${activeTab === "restaurants" ? "border-purple-600 text-purple-700" : "border-transparent text-stone-500"}` }, "Restaurants"),
      React.createElement("button", { onClick: () => setActiveTab("pin"), className: `pb-2 px-4 font-bold border-b-2 ${activeTab === "pin" ? "border-purple-600 text-purple-700" : "border-transparent text-stone-500"}` }, "PIN Generator")
    ),
    
    activeTab === "restaurants" && React.createElement(
      "div",
      { className: "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" },
      restaurants.map((rest) => React.createElement(
        "div",
        { key: rest.id, onClick: () => setSelectedRest(rest), className: "bg-white p-4 rounded-2xl border shadow-sm cursor-pointer hover:shadow-md transition" },
        React.createElement("h3", { className: "font-black text-lg" }, rest.name),
        React.createElement("p", { className: "text-[10px] text-stone-500 font-mono mb-2" }, `ID: ${rest.id}`),
        React.createElement("span", { className: `px-2 py-1 rounded text-[10px] font-bold ${rest.subscriptionStatus === "ACTIVE" ? "bg-emerald-100 text-emerald-800" : "bg-red-100 text-red-800"}` }, rest.subscriptionStatus),
        React.createElement("p", { className: "text-xs mt-3 text-stone-600 font-bold" }, `Due: ${rest.dueDate}`)
      ))
    ),

    activeTab === "pin" && React.createElement(
      "div",
      { className: "max-w-lg mx-auto bg-white p-6 rounded-2xl border shadow-sm" },
      React.createElement("h2", { className: "font-black text-lg mb-4" }, "Generate New Restaurant"),
      React.createElement("form", { onSubmit: handleGeneratePins, className: "space-y-4" },
        React.createElement("input", { type: "text", placeholder: "Restaurant Name", value: restaurantName, onChange: (e) => setRestaurantName(e.target.value), className: "w-full p-3 border rounded-xl" }),
        React.createElement("button", { type: "submit", className: "w-full py-3 bg-purple-600 text-white rounded-xl font-bold" }, "Generate PINs")
      ),
      generatedResult && React.createElement("div", { className: "mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2" },
        React.createElement("h4", { className: "font-bold text-emerald-800" }, `${generatedResult.name} is Live!`),
        React.createElement("p", { className: "font-mono text-sm" }, `Owner PIN: ${generatedResult.ownerPin}`),
        React.createElement("p", { className: "font-mono text-sm" }, `Kitchen PIN: ${generatedResult.kitchenPin}`)
      )
    ),

    selectedRest && React.createElement(
      "div",
      { className: "fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" },
      React.createElement(
        "div",
        { className: "bg-white p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl" },
        React.createElement("h3", { className: "font-black text-lg text-stone-900 border-b pb-2" }, selectedRest.name),
        React.createElement("div", { className: "space-y-2 text-sm font-mono bg-stone-50 p-3 rounded-xl border" },
          React.createElement("p", null, "Owner PIN: ", React.createElement("b", { className: "text-amber-700" }, selectedRest.ownerPin)),
          React.createElement("p", null, "Kitchen PIN: ", React.createElement("b", { className: "text-blue-700" }, selectedRest.kitchenPin))
        ),
        React.createElement("div", { className: "flex gap-2" },
          React.createElement("button", { onClick: () => { onRenew(selectedRest.id); setSelectedRest(null); }, className: "flex-1 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold" }, "Renew"),
          React.createElement("button", { onClick: () => handleDeleteRestaurant(selectedRest.id), className: "flex-1 py-2 bg-red-600 text-white rounded-xl text-xs font-bold" }, "Delete")
        ),
        React.createElement("button", { onClick: () => setSelectedRest(null), className: "w-full py-2 bg-stone-200 rounded-xl text-xs font-bold" }, "Close")
      )
    )
  );
}

// ==========================================
// 7. LOGIN MODAL
// ==========================================
function PinLoginModal({ restaurants, defaultRestId, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const handleLogin = () => {
    if (pin === "999999") return onSuccess({ role: "admin" });
    const currentRest = restaurants.find((r) => r.id === defaultRestId);
    if (currentRest) {
      if (currentRest.ownerPin === pin) return onSuccess({ role: "owner", restaurantId: currentRest.id });
      if (currentRest.kitchenPin === pin) return onSuccess({ role: "kitchen", restaurantId: currentRest.id });
    }
    const ownerRest = restaurants.find((r) => r.ownerPin === pin);
    if (ownerRest) return onSuccess({ role: "owner", restaurantId: ownerRest.id });
    const kitchenRest = restaurants.find((r) => r.kitchenPin === pin);
    if (kitchenRest) return onSuccess({ role: "kitchen", restaurantId: kitchenRest.id });
    
    if (pin === "111111") return onSuccess({ role: "owner", restaurantId: "rest-101" });
    if (pin === "222222") return onSuccess({ role: "kitchen", restaurantId: "rest-101" });
    setError("Invalid PIN");
  };

  return React.createElement(
    "div",
    { className: "fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" },
    React.createElement(
      "div",
      { className: "bg-white rounded-3xl p-6 w-full max-w-xs text-center space-y-4 shadow-2xl" },
      React.createElement("h2", { className: "text-lg font-black" }, "Staff Access"),
      React.createElement("div", { className: "flex justify-center gap-2" },
        [0,1,2,3,4,5].map(i => React.createElement("div", { key: i, className: `w-8 h-10 rounded border flex items-center justify-center font-bold ${pin[i] ? "bg-amber-50 border-amber-600" : "bg-stone-50"}` }, pin[i] ? "•" : ""))
      ),
      error && React.createElement("p", { className: "text-xs text-red-500 font-bold" }, error),
      React.createElement("div", { className: "grid grid-cols-3 gap-2" },
        [1,2,3,4,5,6,7,8,9].map(n => React.createElement("button", { key: n, onClick: () => setPin(p => p.length < 6 ? p + n : p), className: "py-3 bg-stone-100 rounded-xl font-bold" }, n)),
        React.createElement("button", { onClick: () => setPin(""), className: "py-3 bg-stone-100 rounded-xl font-bold text-xs" }, "Clear"),
        React.createElement("button", { onClick: () => setPin(p => p.length < 6 ? p + "0" : p), className: "py-3 bg-stone-100 rounded-xl font-bold" }, "0"),
        React.createElement("button", { onClick: () => setPin(p => p.slice(0, -1)), className: "py-3 bg-stone-100 rounded-xl font-bold" }, "⌫")
      ),
      React.createElement("button", { onClick: handleLogin, className: "w-full py-3 bg-amber-600 text-white rounded-xl font-bold" }, "Verify"),
      React.createElement("button", { onClick: onCancel, className: "text-xs text-stone-500 font-bold" }, "Cancel")
    )
  );
}

  const qrCodeImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(cleanTableUrl)}`;

  return React.createElement(
    "div",
    { className: "fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" },
    React.createElement(
      "div",
      { className: "bg-white p-6 rounded-3xl w-full max-w-sm space-y-4" },
      React.createElement("h3", { className: "font-black text-lg" }, "Table QR Generator"),
      React.createElement("input", { type: "number", value: tbl, onChange: (e) => setTbl(e.target.value), className: "w-full p-2 border rounded-xl font-bold" }),
      React.createElement("div", { className: "bg-stone-900 p-4 rounded-2xl text-center text-white" },
        React.createElement("p", { className: "text-xs text-amber-400 font-bold uppercase" }, restaurantName),

}
